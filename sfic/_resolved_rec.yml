# Text RECOGNITION -> SVTR_LCNet, MultiLoss = CTCLoss + NRTRLoss (attention decoder, training only)
# Inference uses the CTC head only, so it stays fast.
Global:
  use_gpu: true
  epoch_num: 100
  log_smooth_window: 20
  print_batch_step: 20
  save_model_dir: C:/Users/satkb/OneDrive/Desktop/sfic/output/rec
  save_epoch_step: 5
  eval_batch_step: [0, 500]
  cal_metric_during_train: false
  pretrained_model: null
  checkpoints: null
  save_inference_dir: C:/Users/satkb/OneDrive/Desktop/sfic/inference/rec
  use_visualdl: true
  infer_img: C:/Users/satkb/OneDrive/Desktop/sfic/data/rec/test_images
  character_dict_path: C:/Users/satkb/OneDrive/Desktop/sfic/data/rec/dict.txt
  max_text_length: &max_text_length 25
  infer_mode: false
  use_space_char: true
  distributed: false
  save_res_path: C:/Users/satkb/OneDrive/Desktop/sfic/output/rec/predicts.txt

Optimizer:
  name: AdamW
  beta1: 0.9
  beta2: 0.999
  epsilon: 1.0e-08
  lr:
    name: Cosine
    learning_rate: 0.001
    warmup_epoch: 5
  regularizer:
    name: L2
    factor: 3.0e-05

Architecture:
  model_type: rec
  algorithm: SVTR_LCNet
  Transform: null
  Backbone:
    name: PPLCNetV3
    scale: 0.95
  Head:
    name: MultiHead
    head_list:
      - CTCHead:
          Neck:
            name: svtr
            dims: 120
            depth: 2
            hidden_dims: 120
            kernel_size: [1, 3]
            use_guide: True
          Head:
            fc_decay: 0.00001
      - NRTRHead:
          nrtr_dim: 384
          max_text_length: *max_text_length

Loss:
  name: MultiLoss
  loss_config_list:
    - CTCLoss: null
    - NRTRLoss: null

PostProcess:
  name: CTCLabelDecode

Metric:
  name: RecMetric          # acc + norm_edit_dis (F1 added by tools/f1_rec.py)
  main_indicator: acc
  ignore_space: false

Train:
  dataset:
    name: SimpleDataSet
    data_dir: C:/Users/satkb/OneDrive/Desktop/sfic/data/rec/
    ext_op_transform_idx: 1
    label_file_list:
      - C:/Users/satkb/OneDrive/Desktop/sfic/data/rec/train.txt
    transforms:
      - DecodeImage: {img_mode: BGR, channel_first: false}
      - RecConAug: {prob: 0.5, ext_data_num: 2, image_shape: [48, 320, 3], max_text_length: *max_text_length}
      - RecAug: null
      - MultiLabelEncode: {gtc_encode: NRTRLabelEncode}
      - RecResizeImg: {image_shape: [3, 48, 320]}
      - KeepKeys:
          keep_keys: [image, label_ctc, label_gtc, length, valid_ratio]
  loader:
    shuffle: true
    batch_size_per_card: 64      # raise to 128 if VRAM allows
    drop_last: true
    num_workers: 2

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: C:/Users/satkb/OneDrive/Desktop/sfic/data/rec/
    label_file_list:
      - C:/Users/satkb/OneDrive/Desktop/sfic/data/rec/test.txt
    transforms:
      - DecodeImage: {img_mode: BGR, channel_first: false}
      - MultiLabelEncode: {gtc_encode: NRTRLabelEncode}
      - RecResizeImg: {image_shape: [3, 48, 320]}
      - KeepKeys:
          keep_keys: [image, label_ctc, label_gtc, length, valid_ratio]
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 64
    num_workers: 2

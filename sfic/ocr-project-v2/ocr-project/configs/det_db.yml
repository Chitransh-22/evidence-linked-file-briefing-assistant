# Text DETECTION  -> DB algorithm, DBLoss (shrink-map BCE + threshold-map L1 + binary-map Dice)
Global:
  use_gpu: true
  epoch_num: 200
  log_smooth_window: 20
  print_batch_step: 20
  save_model_dir: {ROOT}/output/det
  save_epoch_step: 10
  eval_batch_step: [0, 200]
  cal_metric_during_train: false
  pretrained_model: {PRETRAINED}
  checkpoints: {CHECKPOINT}
  save_inference_dir: {ROOT}/inference/det
  use_visualdl: true
  infer_img: {ROOT}/data/det/test_images
  save_res_path: {ROOT}/output/det/predicts.txt

Architecture:
  model_type: det
  algorithm: DB
  Transform: null
  Backbone:
    name: PPLCNetV3
    scale: 0.75
    det: True
  Neck:
    name: RSEFPN
    out_channels: 96
    shortcut: True
  Head:
    name: DBHead
    k: 50

Loss:
  name: DBLoss
  balance_loss: true
  main_loss_type: DiceLoss
  alpha: 5
  beta: 10
  ohem_ratio: 3

Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 0.001
    warmup_epoch: 2
  regularizer:
    name: L2
    factor: 5.0e-05

PostProcess:
  name: DBPostProcess
  thresh: 0.3
  box_thresh: 0.6
  max_candidates: 1000
  unclip_ratio: 1.5

Metric:
  name: DetMetric          # precision / recall / hmean (hmean == F1)
  main_indicator: hmean

Train:
  dataset:
    name: SimpleDataSet
    data_dir: {ROOT}/data/det/
    label_file_list:
      - {ROOT}/data/det/train_label.txt
    ratio_list: [1.0]
    transforms:
      - DecodeImage: {img_mode: BGR, channel_first: false}
      - DetLabelEncode: null
      - IaaAugment:
          augmenter_args:
            - {type: Fliplr, args: {p: 0.5}}
            - {type: Affine, args: {rotate: [-10, 10]}}
            - {type: Resize, args: {size: [0.5, 3]}}
      - EastRandomCropData: {size: [640, 640], max_tries: 50, keep_smaller: true}
      - MakeBorderMap: {shrink_ratio: 0.4, thresh_min: 0.3, thresh_max: 0.7}
      - MakeShrinkMap: {shrink_ratio: 0.4, min_text_size: 8}
      - NormalizeImage:
          scale: 1./255.
          mean: [0.485, 0.456, 0.406]
          std: [0.229, 0.224, 0.225]
          order: hwc
      - ToCHWImage: null
      - KeepKeys:
          keep_keys: [image, threshold_map, threshold_mask, shrink_map, shrink_mask]
  loader:
    shuffle: true
    drop_last: false
    batch_size_per_card: 8      # lower to 4 if you run out of VRAM
    num_workers: 2

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: {ROOT}/data/det/
    label_file_list:
      - {ROOT}/data/det/test_label.txt
    transforms:
      - DecodeImage: {img_mode: BGR, channel_first: false}
      - DetLabelEncode: null
      - DetResizeForTest: {limit_side_len: 960, limit_type: max}
      - NormalizeImage:
          scale: 1./255.
          mean: [0.485, 0.456, 0.406]
          std: [0.229, 0.224, 0.225]
          order: hwc
      - ToCHWImage: null
      - KeepKeys:
          keep_keys: [image, shape, polys, ignore_tags]
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 1
    num_workers: 2

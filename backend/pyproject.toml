[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "government-evidence-system"
version = "1.0.0"
description = "Government Document Evidence Intelligence & Briefing Management System"
authors = [{ name = "Principal Software Architect" }]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pymongo>=4.6.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "reportlab>=4.1.0",
    "nltk>=3.8.1",
    "qdrant-client>=1.8.0",
    "celery>=5.3.6",
    "pika>=1.3.2",
    "minio>=7.2.0",
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

